version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - bodyclose
    - errorlint
    - gosec
  settings:
    gosec:
      excludes:
        - G104 # errcheck covers unhandled errors
        - G115 # int64 -> uint64 in chain.go is a deliberate bit reinterpretation for hashing
        - G304 # the CSV path in `reconcile --file` is the operator's own flag
    errcheck:
      exclude-functions:
        - (*os.File).Close
        - (github.com/jackc/pgx/v5.Tx).Rollback
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck, bodyclose]
