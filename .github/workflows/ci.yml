name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.25', '1.26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: go test -race -short ./...

  e2e:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pg: ['16', '17']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go test -race -count=1 -cover ./...
        env:
          SUMZERO_TEST_PG_IMAGE: postgres:${{ matrix.pg }}-alpine
